<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Skill 管理页 · 界面原型</title>
<style>
:root{
  --canvas:#101010; --navigation:#161616; --surface:#181818; --surface-muted:#202020;
  --surface-raised:#1f1f20; --surface-hover:#242424; --media-canvas:#080808;
  --ink:#f3f3f5; --sub:#b4b4bc; --placeholder:#9797a1; --disabled-ink:#737373;
  --hair:#2d2d2d; --border-control:#4a4a4a; --border-hover:#737373;
  --accent:#c1c1c5; --accent-fill:#f5f5f5; --accent-hover:#fff; --accent-active:#e5e5e5;
  --accent-strong:#f5f5f5; --pale:#2b2b2b; --accent-border:#c1c1c5; --on-accent:#171717;
  --success:#4ade80; --success-bg:#152a1c; --success-border:#2d593a;
  --warning:#fbbf24; --warning-bg:#30271b; --warning-border:#675033;
  --danger:#f87171; --danger-bg:#321f1f; --danger-border:#683b3b;
  --read:#d9d9df;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0a0a0a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);font-size:13px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
.ic.xs{width:12px;height:12px}

/* ---------- gallery chrome (not captured) ---------- */
.gallery{max-width:1520px;margin:0 auto;padding:40px 40px 100px}
.g-head{margin-bottom:36px}
.g-head h1{font-size:26px;font-weight:650;letter-spacing:-.025em;margin:0 0 8px}
.g-head p{color:var(--sub);font-size:13px;line-height:1.8;margin:0;max-width:80ch}
.board{margin:0 0 56px}
.board > .screen{box-shadow:0 24px 80px rgb(0 0 0 / 55%)}
.caption{display:flex;gap:12px;align-items:baseline;margin:14px 0 0;padding-left:2px}
.caption b{font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap}
.caption span{font-size:12px;color:var(--sub);line-height:1.7}

/* ---------- screen shell ---------- */
.screen{
  position:relative;display:grid;grid-template-columns:200px 1fr;
  background:var(--canvas);overflow:hidden;margin:0 auto;
}
.screen.narrow{grid-template-columns:182px 1fr}
.sidebar{background:var(--navigation);border-right:1px solid var(--hair);padding:24px 12px 18px;display:flex;flex-direction:column;gap:5px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 30px;font-size:15px;font-weight:650;color:var(--ink);line-height:1.3}
.brand-mark{width:34px;height:36px;flex:none;border-radius:9px;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center}
.brand small{display:block;color:var(--sub);font-size:10px;font-weight:400;margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;min-height:39px;padding:9px 11px;border:1px solid transparent;border-radius:7px;color:var(--sub);font-size:13px}
.nav.active{background:var(--pale);border-color:var(--accent-border);color:var(--accent-strong)}
.side-foot{margin-top:auto;border-top:1px solid var(--hair);margin-inline:8px;padding:12px 0 0;color:var(--sub);font-size:11px;line-height:1.8}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:var(--navigation);border-bottom:1px solid var(--hair);color:var(--sub);font-size:13px}
.narrow .topbar{padding:0 24px}
.top-div{color:var(--border-hover)}
.account{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.ava{width:25px;height:25px;border-radius:7px;background:var(--pale);color:var(--accent-strong);display:grid;place-items:center}
.content{flex:1;min-height:0;padding:30px 32px 40px;overflow:hidden}
.narrow .content{padding:24px}

/* ---------- page head ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
.page-head h1{font-size:26px;font-weight:650;letter-spacing:-.025em;line-height:1.35;margin:0 0 7px}
.narrow .page-head h1{font-size:24px}
.page-head p{margin:0;font-size:13px;line-height:1.7;color:var(--sub);max-width:64ch}
.actions{display:flex;align-items:center;gap:8px;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;
  border:1px solid var(--border-control);border-radius:7px;background:var(--surface-raised);color:var(--ink);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-hover);border-color:var(--border-hover)}
.btn.primary{background:var(--accent-fill);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.ghost:hover{background:var(--surface-hover);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-border);background:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--sub);cursor:pointer}
.icon-btn:hover{background:var(--surface-hover);color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--hair);margin-bottom:18px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:11px 2px 12px;border:0;background:none;color:var(--sub);
  font-family:inherit;font-size:13px;cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
.tab.active{color:var(--accent-strong);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.tab .n{font-size:11px;font-weight:500;line-height:16px;padding:0 6px;border-radius:5px;background:var(--surface-hover);color:var(--sub)}
.tab.active .n{background:var(--pale);color:var(--accent)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.search{display:flex;align-items:center;gap:8px;height:34px;width:290px;padding:0 10px;
  border:1px solid var(--border-control);border-radius:7px;background:var(--canvas);color:var(--placeholder);font-size:13px}
.search .ph{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search .val{flex:1;color:var(--ink)}
.search .clear{display:grid;place-items:center;color:var(--sub)}
.chips{display:flex;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid transparent;
  border-radius:7px;background:transparent;color:var(--sub);font-family:inherit;font-size:12px;cursor:pointer}
.chip .cn{font-size:11px;color:var(--placeholder)}
.chip.on{background:var(--pale);border-color:var(--accent-border);color:var(--accent-strong)}
.chip.on .cn{color:var(--accent)}
.spacer{flex:1}
.filter-count{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:5px;
  background:var(--accent-fill);color:var(--on-accent);font-size:10px;font-weight:700}

/* ---------- card grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-content:start}
.card{position:relative;display:flex;flex-direction:column;min-height:176px;padding:15px 16px;
  background:var(--surface);border:1px solid var(--hair);border-radius:12px;cursor:pointer}
.card:hover{background:var(--surface-raised);border-color:var(--border-hover)}
.card.off .card-name{color:var(--sub)}
.card.off .icon-tile{opacity:.45}
.card-head{display:flex;align-items:flex-start;gap:10px}
.icon-tile{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:9px;
  background:var(--surface-muted);border:1px solid var(--hair);color:var(--accent)}
.icon-tile .ic{width:19px;height:19px}
.icon-tile.lg{width:44px;height:44px;border-radius:11px}
.icon-tile.lg .ic{width:22px;height:22px}
.card-title{flex:1;min-width:0;padding-top:1px}
.card-name{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.card-name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{flex:none;font-size:10px;font-weight:500;line-height:16px;padding:0 6px;border-radius:5px;
  background:var(--surface-muted);border:1px solid var(--hair);color:var(--sub)}
.mini.off{color:var(--disabled-ink)}
.mini.warn{color:var(--warning);background:var(--warning-bg);border-color:var(--warning-border)}
.card-desc{margin:9px 0 0;font-size:12.5px;line-height:1.65;color:var(--sub);height:41px;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.card-warn{display:flex;align-items:center;gap:6px;margin:9px 0 0;padding:5px 8px;border-radius:6px;
  background:var(--warning-bg);border:1px solid var(--warning-border);color:var(--warning);font-size:11px;
  line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-warn span{overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;align-items:center;gap:6px;margin-top:10px;overflow:hidden;max-height:22px}
.tag{flex:none;font-size:11px;line-height:18px;padding:0 8px;border-radius:4px;background:var(--pale);border:1px solid var(--hair);color:var(--sub)}
.tag.more{border-style:dashed;color:var(--placeholder)}
.card-foot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:11px;border-top:1px solid var(--hair);
  font-size:11px;color:var(--sub);line-height:1.6}
.card-foot .sep{color:var(--border-control)}
.card-foot .detail{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--placeholder);font-size:11px}
.card:hover .card-foot .detail{color:var(--ink)}
.card-foot .saving{color:var(--accent)}

/* switch */
.switch{position:relative;flex:none;width:36px;height:20px;margin-top:2px;padding:0;border-radius:10px;
  border:1px solid var(--border-control);background:var(--surface-muted);cursor:pointer}
.switch i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--disabled-ink)}
.switch.on{background:var(--success-border);border-color:#3d7449}
.switch.on i{left:18px;background:var(--success)}
.switch.dis{opacity:.5;cursor:not-allowed}
.switch.loading{background:var(--surface-muted);border-color:var(--border-control)}
.switch.loading i{left:11px;width:12px;height:12px;background:transparent;border-radius:50%;
  border:2px solid #5a5a5a;border-top-color:var(--accent)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- note ---------- */
.page-note{margin:18px 0 0;font-size:11px;line-height:1.8;color:var(--placeholder);display:flex;align-items:center;gap:6px}

/* ---------- states ---------- */
.state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:380px;padding:56px 24px;text-align:center;background:var(--surface);
  border:1px dashed var(--border-control);border-radius:12px}
.state-ic{display:grid;place-items:center;width:52px;height:52px;margin-bottom:16px;border-radius:14px;
  background:var(--surface-muted);border:1px solid var(--hair);color:var(--accent)}
.state-ic .ic{width:24px;height:24px}
.state h3{font-size:19px;font-weight:600;margin:0 0 9px}
.state p{margin:0;font-size:13px;line-height:1.75;color:var(--sub);max-width:52ch}
.state-actions{display:flex;gap:8px;margin-top:22px}
.state-link{display:inline-flex;align-items:center;gap:4px;margin-top:20px;font-size:12px;color:var(--accent);cursor:pointer}
.state.err{border-style:solid;border-color:var(--danger-border);background:linear-gradient(180deg,rgba(50,31,31,.55),var(--surface) 60%)}
.state.err .state-ic{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-border)}
.state .err-detail{margin-top:14px;font-family:Consolas,monospace;font-size:11px;color:var(--placeholder);max-width:none;white-space:nowrap}
.state .one{margin-top:24px}
.state.gap{min-height:300px}

/* ---------- skeleton ---------- */
.sk{min-height:176px;padding:15px 16px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  display:flex;flex-direction:column}
.sk i{display:block;border-radius:6px;background:#272727}
.sk .r1{display:flex;gap:10px;align-items:flex-start}
.sk .t{width:36px;height:36px;border-radius:9px;background:#2b2b2e}
.sk .l{height:12px;margin-top:6px}
.sk .l.w1{width:58%}.sk .l.w2{width:100%;margin-top:16px}.sk .l.w3{width:86%;margin-top:8px}
.sk .tags{display:flex;gap:6px;margin-top:14px}
.sk .tags i{width:46px;height:16px;border-radius:4px}
.sk .foot{margin-top:auto;height:11px;width:64%}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:9px;
  padding:9px 14px 9px 12px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--hair);
  box-shadow:0 12px 36px rgb(0 0 0 / 45%);font-size:12.5px;color:var(--ink);white-space:nowrap}
.toast .ic{color:var(--success)}

/* ---------- modal ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgb(0 0 0 / 72%)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;width:900px;max-height:770px;
  display:flex;flex-direction:column;background:var(--surface-raised);border:1px solid var(--border-control);
  border-radius:12px;box-shadow:0 24px 80px rgb(0 0 0 / 55%);overflow:hidden}
.m-head{display:flex;align-items:flex-start;gap:13px;padding:18px 20px 15px;border-bottom:1px solid var(--hair)}
.m-id{flex:1;min-width:0}
.m-id h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:1px 0 7px;line-height:1.4}
.m-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip-s{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:19px;padding:0 8px;
  border-radius:5px;background:var(--surface-muted);border:1px solid var(--hair);color:var(--sub)}
.chip-s.ok{background:var(--success-bg);border-color:var(--success-border);color:var(--success)}
.chip-s.mine{background:var(--pale);border-color:var(--border-control);color:var(--accent)}
.m-actions{display:flex;align-items:center;gap:6px;flex:none;padding-top:2px}
.sw-wrap{display:flex;align-items:center;gap:8px;margin-right:6px;font-size:11px;color:var(--sub)}
.m-body{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0;flex:1;overflow:hidden}
.m-left{padding:18px 20px 20px;overflow:hidden}
.m-right{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--hair);background:var(--canvas);padding:16px 18px 0}
.block{margin-bottom:17px}
.block:last-child{margin-bottom:0}
.block h4{display:flex;align-items:center;gap:6px;margin:0 0 7px;font-size:11px;font-weight:600;
  letter-spacing:.05em;color:var(--placeholder)}
.block h4 .cnt{font-weight:400;color:var(--disabled-ink);letter-spacing:0}
.m-desc{margin:0;font-size:13px;line-height:1.75;color:var(--read)}
.seg{display:inline-flex;padding:2px;border:1px solid var(--hair);border-radius:8px;background:var(--surface)}
.seg button{height:26px;padding:0 11px;border:0;border-radius:6px;background:none;color:var(--sub);
  font-family:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--pale);color:var(--accent-strong);box-shadow:inset 0 0 0 1px var(--accent-border);font-weight:600}
.hint{margin:7px 0 0;font-size:11.5px;line-height:1.7;color:var(--placeholder)}
.block .tags{margin-top:0;max-height:none;flex-wrap:wrap}
.quiet{margin:0;padding:9px 11px;border-radius:7px;background:var(--surface-muted);border:1px solid var(--hair);
  font-size:11.5px;line-height:1.75;color:var(--sub)}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:var(--surface);
  border:1px solid var(--hair);font-size:11.5px;color:var(--sub)}
.res li .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--read);font-family:Consolas,monospace;font-size:11px}
.res li .k{font-size:10px;line-height:16px;padding:0 5px;border-radius:4px;background:var(--pale);color:var(--sub)}
.res li .sz{color:var(--placeholder);font-size:10.5px}
.res li button{border:0;background:none;color:var(--accent);font-family:inherit;font-size:11.5px;cursor:pointer;padding:0}
.m-right-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;flex:none}
.m-right-head h4{margin:0;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--placeholder)}
.doc{margin:0;overflow:auto;flex:1;padding:0 2px 18px;font-size:12.5px;line-height:1.85;color:var(--read)}
.doc h1{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 10px}
.doc h2{font-size:12.5px;font-weight:600;color:var(--ink);margin:16px 0 6px}
.doc p{margin:0 0 10px}
.doc ol,.doc ul{margin:0 0 10px;padding-left:19px}
.doc li{margin-bottom:5px}
.doc code{font-family:Consolas,monospace;font-size:11.5px;padding:1px 4px;border-radius:4px;background:var(--surface-muted);color:var(--accent)}
.m-foot{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--hair);background:var(--surface-raised)}
.m-foot .note{font-size:11px;color:var(--placeholder);flex:1;line-height:1.6}
.m-foot .acts{display:flex;gap:8px;flex:none}

/* ---------- small dialog ---------- */
.dialog-sm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;width:484px;
  background:var(--surface-raised);border:1px solid var(--border-control);border-radius:12px;
  box-shadow:0 24px 80px rgb(0 0 0 / 55%);overflow:hidden}
.dialog-sm header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.dialog-sm h2{font-size:16px;font-weight:600;margin:0}
.dialog-sm .body{padding:0 18px 4px}
.dialog-sm .body p{margin:0 0 12px;font-size:12.5px;line-height:1.8;color:var(--sub)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.cmp > div{padding:9px 11px;border-radius:7px;background:var(--surface);border:1px solid var(--hair)}
.cmp h5{margin:0 0 4px;font-size:10.5px;font-weight:500;color:var(--placeholder);letter-spacing:.04em}
.cmp p{margin:0;font-size:12px;color:var(--ink)}
.dialog-sm footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--hair)}

/* ---------- anatomy ---------- */
.anat{display:grid;grid-template-columns:520px minmax(0,1fr);gap:44px;align-items:start;margin-top:6px}
.anat-card-wrap{position:relative;padding:34px 34px 44px}
.anat .card{width:420px;min-height:196px;cursor:default}
.anat .card:hover{background:var(--surface);border-color:var(--hair)}
.dot{position:absolute;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--accent-fill);color:var(--on-accent);font-size:11px;font-weight:700;z-index:2;
  box-shadow:0 0 0 3px var(--canvas)}
.anat-legend{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.anat-item{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--hair)}
.anat-item b{display:grid;place-items:center;width:19px;height:19px;flex:none;border-radius:50%;
  background:var(--surface-hover);color:var(--accent);font-size:10.5px;font-weight:700;margin-top:1px}
.anat-item span{font-size:12px;line-height:1.7;color:var(--sub)}
.anat-item strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:1px}
.anat-note{grid-column:1/-1;margin-top:22px;padding:12px 14px;border-radius:8px;background:var(--surface);
  border:1px solid var(--hair);font-size:12px;line-height:1.8;color:var(--sub)}
.anat-note b{color:var(--ink);font-weight:600}
/* ---------- create / import dialog ---------- */
.cdlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;width:960px;max-height:792px;
  display:flex;flex-direction:column;background:var(--surface-raised);border:1px solid var(--border-control);
  border-radius:12px;box-shadow:0 24px 80px rgb(0 0 0 / 55%);overflow:hidden}
.cdlg.busy::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(193,193,197,.85),transparent)}
.cdlg .m-id p{margin:0;font-size:11.5px;line-height:1.6;color:var(--placeholder)}
.m-body.form{grid-template-columns:336px minmax(0,1fr)}
.m-body.form .m-left{padding:16px 20px 18px;overflow:auto}
.fld{margin-bottom:13px}
.fld > .lb{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;font-size:11px;font-weight:600;
  letter-spacing:.05em;color:var(--placeholder)}
.fld > .lb .req{color:var(--danger);letter-spacing:0}
.fld > .lb .opt-lb{margin-left:auto;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--disabled-ink)}
.inp{width:100%;height:34px;padding:0 10px;border:1px solid var(--border-control);border-radius:7px;
  background:var(--canvas);color:var(--ink);font-family:inherit;font-size:13px;outline:none}
.inp::placeholder{color:var(--placeholder)}
textarea.inp{height:auto;padding:8px 10px;line-height:1.7;resize:none}
.inp[readonly]{color:var(--sub)}
.fld .hint{margin:6px 0 0;font-size:11px;line-height:1.6;color:var(--placeholder)}
.fld .msg{margin:6px 0 0;display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.6;color:var(--danger)}
.fld.err .inp{border-color:var(--danger-border);background:var(--danger-bg)}
.fld.err .inp::placeholder{color:#c99595}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border-control);
  border-radius:7px;background:transparent;color:var(--sub);font-family:inherit;font-size:12px}
.opt.on{border-color:var(--accent-border);background:var(--pale);color:var(--accent-strong)}
.opt .ic{width:12px;height:12px;stroke-width:2.4}
.tagedit{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:34px;padding:5px 8px;
  border:1px solid var(--border-control);border-radius:7px;background:var(--canvas)}
.tagedit .tag{display:inline-flex;align-items:center;gap:5px;padding-right:4px}
.tagedit .x{display:grid;place-items:center;color:var(--placeholder)}
.tagedit input{flex:1;min-width:88px;border:0;background:none;outline:none;color:var(--ink);font-family:inherit;font-size:12.5px}
.tagedit input::placeholder{color:var(--placeholder)}
.swrow{display:flex;align-items:flex-start;gap:10px;margin:2px 0 0;padding:11px 0 3px;border-top:1px solid var(--hair)}
.swrow .txt{flex:1;font-size:12px;line-height:1.5;color:var(--ink)}
.swrow .txt small{display:block;margin-top:2px;font-size:11px;color:var(--placeholder)}
.swrow .switch{margin-top:1px}
.more{margin-top:12px;padding-top:11px;border-top:1px solid var(--hair)}
.more summary{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);list-style:none;cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.more summary .sub{font-size:11px;color:var(--disabled-ink);font-weight:400}
.more .inner{margin-top:12px}
.cdoc{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--hair);background:var(--canvas);padding:16px 18px 0}
.cdoc-head{flex:none;display:flex;align-items:center;gap:8px;padding-bottom:9px}
.cdoc-head h4{margin:0;font-size:12px;font-weight:600;color:var(--ink)}
.bytes{font-size:10.5px;color:var(--placeholder);font-variant-numeric:tabular-nums}
.seg.sm{padding:2px}
.seg.sm button{height:24px;padding:0 9px;font-size:11.5px}
.cdoc .hint{margin:0 0 10px;font-size:11px;line-height:1.6;color:var(--placeholder)}
.cdoc-body{flex:1;display:flex;min-height:0}
.cdoc-body textarea{flex:1;width:100%;min-height:0;padding:12px 14px;border:1px solid var(--border-control);
  border-radius:9px;background:var(--canvas);color:var(--read);font-family:inherit;font-size:12.5px;line-height:1.85;
  resize:none;outline:none}
.cdoc-body textarea::placeholder{color:var(--disabled-ink)}
.cdoc-body textarea.err{border-color:var(--danger-border)}
.cdoc .msg{flex:none;margin:6px 0 0;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--danger)}
.attach{flex:none;display:flex;align-items:center;gap:9px;margin:12px 0 16px;padding:10px 12px;
  border:1px dashed var(--border-control);border-radius:9px;font-size:11.5px;color:var(--sub)}
.attach .n{color:var(--placeholder)}
.attach .btn{margin-left:auto}
.res2{list-style:none;flex:none;margin:12px 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.res2 li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:var(--surface);
  border:1px solid var(--hair);font-size:11.5px;color:var(--sub)}
.res2 .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:Consolas,monospace;font-size:11px;color:var(--read)}
.res2 .x{display:grid;place-items:center;color:var(--placeholder)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(23,23,23,.25);border-top-color:var(--on-accent)}
.idlg-body{flex:1;min-height:0;overflow:hidden;padding:16px 20px 8px}
.dl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:9px 14px;margin:0 0 16px;font-size:12px}
.dl dt{font-size:11px;letter-spacing:.04em;color:var(--placeholder)}
.dl dd{margin:0;color:var(--read);line-height:1.65}
.issuebar{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;padding:9px 11px;border-radius:7px;
  background:var(--warning-bg);border:1px solid var(--warning-border);color:var(--warning);font-size:11.5px;line-height:1.65}
.chip-s.warn{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning)}
.card.fresh{border-color:var(--accent-border);box-shadow:inset 0 0 0 1px var(--accent-border)}
</style>
</head>

<script>
const icon = (n, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const NAV = [['folder','项目管理'],['list','任务管理'],['image','资产库'],['sparkles','Skill 管理'],['settings','AI 配置']];

function sidebar(active){
  return `<aside class="sidebar">
    <div class="brand"><span class="brand-mark">${icon('film')}</span><span>短剧工作台<small>AI 短剧创作空间</small></span></div>
    ${NAV.map(([i,label]) => `<nav class="nav${label===active?' active':''}">${icon(i)}${label}</nav>`).join('')}
    <p class="side-foot">从故事出发，<br>逐镜打磨。</p>
  </aside>`;
}
function topbar(page){
  return `<header class="topbar"><span>创作空间 <span class="top-div">/</span> ${page}</span>
    <span class="account"><span class="ava">${icon('user','ic sm')}</span>个人空间</span></header>`;
}
function head({title='Skill 管理', desc='可复用的创作方法。决定 AI 在什么任务里、用什么方式做事。', actions=true}){
  return `<header class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>
    ${actions ? `<div class="actions">
      <button class="btn">${icon('upload','ic sm')}导入 Skill</button>
      <button class="btn primary">${icon('plus','ic sm')}新建 Skill</button>
    </div>` : ''}</header>`;
}
function tabs(active, mine, builtin){
  return `<div class="tabs">
    <button class="tab${active==='mine'?' active':''}">我的 Skill<span class="n">${mine}</span></button>
    <button class="tab${active==='builtin'?' active':''}">内置 Skill<span class="n">${builtin}</span></button>
  </div>`;
}
function toolbar({query='', chips=[], filterCount=0, muted=false}){
  const search = query
    ? `<div class="search"${muted?' style="opacity:.55"':''}>${icon('search','ic sm')}<span class="val">${query}</span><span class="clear">${icon('x','ic xs')}</span></div>`
    : `<div class="search"${muted?' style="opacity:.55"':''}>${icon('search','ic sm')}<span class="ph">搜索名称、用途或标签</span></div>`;
  return `<div class="toolbar">${search}
    <div class="chips">${chips.map(c=>`<button class="chip${c.on?' on':''}">${c.label}<span class="cn">${c.n}</span></button>`).join('')}</div>
    <span class="spacer"></span>
    <button class="btn ghost">${icon('sliders','ic sm')}筛选${filterCount?`<span class="filter-count">${filterCount}</span>`:''}</button>
  </div>`;
}
function sw(on, {loading=false, disabled=false, label=''}={}){
  const cls = loading ? 'switch loading' : on ? 'switch on' : 'switch';
  return `<button class="${cls}${disabled?' dis':''}" role="switch" aria-checked="${on}"
    aria-label="${label}"${disabled?' aria-disabled="true"':''}><i></i></button>`;
}
function card(s){
  const tags = s.t.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')
    + (s.t.length>3?`<span class="tag more">+${s.t.length-3}</span>`:'');
  const warn = s.issue ? `<p class="card-warn">${icon('alert','ic xs')}<span>需要处理：${s.issue}</span></p>` : '';
  const foot = s.saving
    ? `<span class="saving">正在保存设置…</span>`
    : `<span>${s.modes}</span><span class="sep">·</span><span>${s.inv}</span>${s.res?`<span class="sep">·</span><span>${s.res} 份资料</span>`:''}`;
  const meta = s.off ? `<span class="mini off">已停用</span>` : '';
  const badge = s.issue ? `<span class="mini warn">待处理</span>` : meta;
  return `<article class="card${s.off?' off':''}${s.fresh?' fresh':''}" tabindex="0" aria-label="${s.n}">
    <div class="card-head">
      <span class="icon-tile">${icon(s.i)}</span>
      <div class="card-title"><div class="card-name"><span class="t">${s.n}</span>${badge}</div></div>
      ${sw(s.on, {loading:s.saving, disabled:!!s.issue || s.disabled, label:`启用 ${s.n}`})}
    </div>
    <p class="card-desc">${s.d}</p>
    ${warn}
    <div class="tags">${tags}</div>
    <div class="card-foot">${foot}<span class="detail">查看详情${icon('chevron-right','ic xs')}</span></div>
  </article>`;
}
function pageNote(text){
  return `<p class="page-note">${icon('info','ic xs')}${text}</p>`;
}
function screen({nav='Skill 管理', page='Skill 管理', body, extra='', w=1440, h=900, narrow=false}){
  return `<div class="screen${narrow?' narrow':''}" style="width:${w}px;height:${h}px">
    <svg style="position:absolute;width:0;height:0"><use href="#i-film"/></svg>
    ${sidebar(nav)}
    <div class="main">${topbar(page)}<div class="content">${body}</div></div>
    ${extra}
  </div>`;
}
function board(id, title, caption, html){
  return `<section class="board" id="${id}">${html}
    <p class="caption"><b>${title}</b><span>${caption}</span></p></section>`;
}

const MINE = [

  {n:'季更剧集连续性表', i:'table', d:'把已确认素材整理成人物、服装、持物与场景对照表，供后续镜头核对。', t:['连续性','素材'], modes:'标准创作 · 无限画布', inv:'仅手动', res:2, on:false, off:true, issue:'平台未提供必需工具：timeline_lookup'},
  {n:'分镜节奏体检', i:'activity', d:'按 3 秒一拍的节奏检查镜头密度，指出过慢段落并给出可剪切的建议。', t:['分镜','节奏'], modes:'标准创作', inv:'按需自动', res:0, on:true},
];
const BUILTIN = [
  {n:'创作任务规划', i:'list', d:'把想法或明确请求整理为有边界的创作步骤、依赖和交付物，区分讨论、结构搭建与媒体制作。', t:['规划','目标','步骤','依赖'], res:2},
  {n:'小说创作', i:'book', d:'根据想法、梗概或主动选入的原文创作和定点改写小说，组织人物动机、因果与情节节奏。', t:['小说','大纲','人物','改写'], res:2},

function createDialog(o = {}) {

  const tagsHtml = v.tags.map(t => `<span class="tag">${t}<span class="x">${icon('x', 'ic xs')}</span></span>`).join('');
  const attach = v.files.length
    ? `<ul class="res2">${v.files.map(f => `<li>${icon('file', 'ic sm')}<span class="p">${f.p}</span><span class="k">${f.k}</span><span class="x">${icon('x', 'ic xs')}</span></li>`).join('')}</ul>`

  return `<div class="scrim"></div>
  <div class="cdlg${busy ? ' busy' : ''}" role="dialog" aria-modal="true" aria-labelledby="cd-title">
    <header class="m-head">
      <span class="icon-tile lg" style="border-style:dashed;color:var(--sub)">${icon('plus')}</span>
      <div class="m-id"><h2 id="cd-title">新建 Skill</h2>
        <p>保存后加入「我的 Skill」，默认按需自动，只在任务需要时参与。</p></div>
      <div class="m-actions"><button class="icon-btn" aria-label="关闭"${busy ? ' aria-disabled="true"' : ''}>${icon('x')}</button></div>
    </header>
    <div class="m-body form">
      <div class="m-left">
        ${field('name', '名称', true, `<input class="inp" aria-label="名称" placeholder="例如：竖屏短剧钩子开场" value="${v.name}"${busy ? ' readonly' : ''}${o.focusName ? ' style="border-color:var(--accent);box-shadow:0 0 0 2px rgba(193,193,197,.18)"' : ''}>`, '用一句话说明它能做什么，会显示在卡片上。', '最多 120 字')}
        ${field('desc', '用途', true, `<textarea class="inp" rows="3" aria-label="用途" placeholder="在什么任务里用，能产出什么。"${busy ? ' readonly' : ''}>${v.desc}</textarea>`, '决定用户会不会点开它。', `${v.desc.length} / 2000`)}
        ${field('tags', '标签', false, `<div class="tagedit">${tagsHtml}<input aria-label="添加标签" placeholder="${v.tags.length ? '' : '开场、钩子、竖屏'}"></div>`, '标签参与搜索，不影响生成。', 'Enter 添加')}
        ${field('modes', '适用模式', true, `<div class="opts"><button class="opt on">${icon('check', 'ic')}标准创作</button><button class="opt on">${icon('check', 'ic')}无限画布</button></div>`, '只在勾选的创作模式里出现。')}
        ${field('inv', '触发方式', false, `<div class="seg"><button class="${v.inv === '按需自动' ? 'on' : ''}">按需自动</button><button class="${v.inv === '仅手动' ? 'on' : ''}">仅手动</button></div>`, '按需自动：AI 判断需要时自己带上；仅手动：只在输入框用 / 调用。')}
        <div class="swrow"><div class="txt">创建后立即启用<small>关闭时只保存到库，不参与任何任务。</small></div>${sw(v.on, { label: '创建后立即启用' })}</div>
        <details class="more"><summary>${icon('chevron-right', 'ic xs')}更多设置<span class="sub">不适用场景、来源、格式标识</span></summary>
          <div class="inner">
            <div class="fld"><div class="lb">不适用<span class="opt-lb">可选</span></div><textarea class="inp" rows="2" aria-label="不适用" placeholder="这份方法不该用在什么任务上"></textarea></div>
            <div class="fld"><div class="lb">来源与适配说明<span class="opt-lb">可选</span></div><textarea class="inp" rows="2" aria-label="来源"></textarea></div>
            <div class="fld" style="margin-bottom:0"><div class="lb">格式标识<span class="opt-lb">自动生成，不用改</span></div><input class="inp" readonly value="skill-3f9a2c1b"></div>
          </div></details>
      </div>
      <div class="cdoc">
        <div class="cdoc-head"><h4>方法正文</h4>${v.doc ? `<span class="bytes">${kb(v.doc)} KB / 64 KB</span>` : ''}<span class="spacer"></span>
          <div class="seg sm"><button class="on">编写</button><button>预览</button></div>
          <button class="icon-btn" aria-label="展开为全屏编辑器">${icon('expand')}</button></div>
        <p class="hint">写清必要输入、方法步骤、输出与自检。长资料放附加资料，不要塞进正文。</p>
        <div class="cdoc-body"><textarea aria-label="方法正文" placeholder="${DOC_EMPTY}"${busy ? ' readonly' : ''}${e.doc ? ' class="err"' : ''}>${v.doc}</textarea></div>
        ${e.doc ? `<p class="msg">${icon('alert', 'ic xs')}${e.doc}</p>` : ''}
        ${attach}
      </div>
    </div>
    <footer class="m-foot"><span class="note"${o.statusColor ? ` style="color:${o.statusColor}"` : ''}>${o.status || ''}</span>
      <div class="acts"><button class="btn"${busy ? ' disabled' : ''}>取消</button>
        ${busy ? `<button class="btn primary" aria-busy="true" disabled><span class="spin"></span>正在创建…</button>`
          : '<button class="btn primary">创建 Skill</button>'}</div></footer>
  </div>`;
}
