<div class="reviewbar">
  <div><strong>页面原型</strong><span>本轮评审：嵌入现有工作台的配置模块。全部为演示数据，请勿填写真实密钥。</span></div>
  <div class="review-actions"><button class="btn quiet small" id="review-toggle" aria-expanded="false">状态演示</button><button class="btn quiet small" id="reset-demo">恢复演示</button></div>
</div>

  <label>列表状态<select id="demo-list"><option value="ready">已有三个模型</option><option value="empty">首次进入，没有模型</option><option value="loading">正在加载</option><option value="error">读取失败</option><option value="no-default">没有默认模型</option><option value="many">长内容与多页模型</option></select></label>

  <label>下次获取目录<select id="demo-directory"><option value="success">获取成功</option><option value="failed">获取失败，可手动填写</option></select></label><label>下次列表操作<select id="demo-row"><option value="success">操作成功</option><option value="failed">操作失败，保留原状态</option></select></label><p>这些控件只用于检查设计状态，列表状态持续生效，其他反馈仅作用于下一次操作，不属于正式配置页面。</p>
</aside>
<div class="prototype">
  <aside class="studio-sidebar" aria-label="工作台侧栏">
    <div class="studio-brand"><span class="studio-brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v12H3z M3 8V4h18v4 M7 4l3 4 M13 4l3 4 M19 4l2 3 M10 12l5 3-5 3z"/></svg></span><span>短剧工作台<small>AI 短剧创作空间</small></span></div>
    <nav aria-label="主导航">
      <button class="studio-nav" aria-disabled="true" title="此原型仅展示配置模块"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h6l2 2h10v13H3z"/></svg>项目管理</button>
      <button class="studio-nav" aria-disabled="true" title="此原型仅展示配置模块"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3z M3 16l6-6 5 5 3-3 4 4 M16 8h.01"/></svg>资产库</button>
      <button class="studio-nav" aria-disabled="true" title="此原型仅展示配置模块"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h5v16H3z M11 4h4v16h-4z M18 4l3 15"/></svg>Skill 管理</button>
      <button class="studio-nav active" aria-current="page" id="nav-config"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M4 17h16 M8 4v6 M16 14v6"/></svg>配置</button>
    </nav>
    <p class="studio-sidebar-foot">从故事出发，逐镜打磨。</p>

function runRowAction(kind,id){
  const model=models.find(row=>row.id===id);if(!model||busyRows.has(id))return;
  const outcome=rowOutcome;rowOutcome='success';document.getElementById('demo-row').value='success';busyRows.add(id);rowErrors.delete(id);updateRows();
  setTimeout(()=>{
    busyRows.delete(id);
    if(outcome==='failed'){rowErrors.set(id,{kind,text:kind==='default'?'设置默认失败，原默认模型保持不变。':kind==='delete'?'删除未成功，该模型仍保留。':'启用状态未能保存，已保留原状态。'});updateRows();return}
    if(kind==='toggle'){model.enabled=!model.enabled;if(!model.enabled)model.isDefault=false;notice={text:(model.enabled?'已启用':'已停用')+'“'+model.name+'”。',type:'success'}}
    if(kind==='default'){models.forEach(m=>m.isDefault=m.id===id);notice={text:'已设置“'+model.name+'”为默认文本模型。',type:'success'}}
    if(kind==='delete'){models=models.filter(m=>m.id!==id);notice={text:'已删除“'+model.name+'”。',type:'success'}}
    renderList();const target=content.querySelector('[data-action="'+(kind==='toggle'?'toggle':'more')+'"][data-id="'+id+'"]');target?.focus();
  },350);
}
function changeEnabled(id){
  const m=models.find(row=>row.id===id);
  const change=()=>runRowAction('toggle',id);
  if(m.enabled&&m.isDefault)confirmAction('停用默认文本模型','停用“'+m.name+'”后将没有默认文本模型。已保存的配置会保留。','停用并清除默认',change);else change();
}
function discover(){
  if(discoverBusy||!form)return;
  formIssues={};
  if(!form.url.trim()){formIssues.url='请先填写服务地址，再获取模型。';renderForm();document.getElementById('service-url').focus();return}
  discoverBusy=true;form.discovered=[];form.discoveryMessage='';form.pickerOpen=false;form.pickerSearch='';form.pickerActive=-1;renderForm();
  const requested=form,signature=JSON.stringify([form.providerId,form.url,form.apiKey,form.keyMode,form.format]),outcome=directoryOutcome;directoryOutcome='success';document.getElementById('demo-directory').value='success';
  setTimeout(()=>{
    discoverBusy=false;if(form!==requested)return;
    if(signature!==JSON.stringify([form.providerId,form.url,form.apiKey,form.keyMode,form.format])){renderForm();return}
    if(outcome==='failed'){form.discoveryMessage='无法获取模型，可重试或直接填写。';renderForm();document.getElementById('model-id').focus();return}
    form.discovered=(presets[form.providerId]||presets.custom).models;form.discoveryMessage='已获取 '+form.discovered.length+' 个模型。';form.pickerOpen=true;renderForm();document.getElementById('model-id').focus();
  },650);
}
function validateForm(){
  const errors={};
  if(!form.providerId)errors.providerId='请选择服务商。';
  try{const url=new URL(form.url);if(!['http:','https:'].includes(url.protocol))errors.url='请输入 HTTP 或 HTTPS 地址。'}catch{errors.url='请输入完整服务地址。'}
  if(!form.modelId.trim())errors.modelId='请输入或选择模型标识。';
  return errors;
}
function settleSave(original,checked=false,defaultFailed=false){
  const item={id:original.id||'m'+serial++,name:original.name.trim()||original.modelId.trim(),provider:(presets[original.providerId]||presets.custom).name,providerId:original.providerId,modelId:original.modelId.trim(),url:original.url.trim(),format:original.format,hasKey:original.keyMode==='keep'||original.keyMode==='replace'&&!!original.apiKey,enabled:original.enabled,isDefault:original.enabled&&(defaultFailed?models.some(m=>m.id===original.id&&m.isDefault):original.makeDefault)};
  if(item.isDefault)models.forEach(m=>m.isDefault=false);
  if(original.id){models=models.map(m=>m.id===original.id?item:m)}else models.push(item);
  tests.delete(item.id);form=null;highlightId=item.id;saveBusy=false;notice=defaultFailed?{text:'“'+item.name+'”已保存，但设为默认失败。原默认模型保持不变。',type:'warning',action:'<button class="btn small" data-action="retry-default" data-id="'+item.id+'">重试设为默认</button>'}:{text:checked?'已核对，这次配置已保存。':'已保存“'+item.name+'”。',type:'success'};page=original.id?listContext.page:Math.floor(models.findIndex(m=>m.id===item.id)/20);listState='ready';renderList();if(original.id)restoreListPosition();else requestAnimationFrame(()=>content.querySelector('.row-flash')?.scrollIntoView({block:'nearest'}));setTimeout(()=>{highlightId='';content.querySelector('.row-flash')?.classList.remove('row-flash')},1800);
}
function saveForm(){
  if(saveBusy||form.state==='unknown'||form.state==='conflict')return;
  formIssues=validateForm();
  if(Object.keys(formIssues).length){renderForm();const ids={providerId:'provider',url:'service-url',apiKey:'api-key',modelId:'model-id'};document.getElementById(ids[Object.keys(formIssues)[0]]).focus();return}
  const payload=structuredClone(form),outcome=saveOutcome,targetForm=form;saveOutcome='success';document.getElementById('demo-save').value='success';saveBusy=true;renderForm();
  setTimeout(()=>{if(form!==targetForm)return;saveBusy=false;if(outcome==='success'||outcome==='default-failed'){settleSave(payload,false,outcome==='default-failed'&&payload.makeDefault);return}form.state=outcome==='failed'?'failed':outcome==='unknown'?'unknown':'conflict';renderForm()},650);
}
function showConflict(){
  dialogTrigger=document.activeElement;
  const server=models.find(m=>m.id===form.id)||{name:'日常创作（最新）',url:form.url,modelId:form.modelId};
  const latestName=server.name+'（已更新）';
  document.getElementById('conflict-body').innerHTML='<p>其他窗口修改了这条配置。核对后选择从哪份内容继续编辑，确认动作不会直接保存。</p><table class="compare"><thead><tr><th>字段</th><th>服务器当前内容</th><th>我的填写</th></tr></thead><tbody><tr><td>显示名称</td><td>'+esc(latestName)+'</td><td>'+esc(form.name||form.modelId)+'</td></tr><tr><td>服务地址</td><td>'+esc(server.url)+'</td><td>'+esc(form.url)+'</td></tr><tr><td>模型标识</td><td>'+esc(server.modelId)+'</td><td>'+esc(form.modelId)+'</td></tr></tbody></table><p class="demo-note" style="margin-top:15px">密钥只显示是否已保存，不参与明文对照。</p>';
  document.getElementById('use-latest').onclick=()=>{form=newForm({...server,name:latestName});baseline=serializeForm(form);saveOutcome='success';document.getElementById('demo-save').value='success';closeDialog('conflict-dialog');renderForm()};
  document.getElementById('keep-draft').onclick=()=>{form.state='ready';saveOutcome='success';document.getElementById('demo-save').value='success';closeDialog('conflict-dialog');renderForm()};
  document.getElementById('conflict-dialog').showModal();
}
function showTest(id){
  const m=models.find(row=>row.id===id);dialogTrigger=document.activeElement;
  activeTest=id;if(!tests.has(id))tests.set(id,{state:'idle',outcome:testOutcome});
  document.getElementById('test-title').textContent='测试文本模型 · '+m.name;renderTest();
  document.getElementById('test-dialog').showModal();
}
function renderTest(){
  const state=tests.get(activeTest),running=['queued','running'].includes(state.state);
  const labels={idle:'尚未开始',queued:'排队中',running:'测试中',succeeded:'已收到模型返回',failed:'测试失败',unknown:'受理结果待核对',cancelled:'测试已取消'};
  let detail='';
  if(state.state==='succeeded')detail=(state.detectedFormat?'<p class="field-hint">已识别：'+esc(formatNames[state.detectedFormat])+'</p>':'')+'<pre class="test-response">人物动机让角色的选择有因可循，也让故事冲突更有说服力。</pre>';
  if(state.state==='failed')detail='<div class="notice error" role="alert"><span>'+(state.outcome==='protocol'?'无法识别接口类型，请在编辑中手动选择。':state.outcome==='auth'?'密钥无效或没有访问该模型的权限。请编辑模型，核对服务地址与密钥。':'模型服务请求过于频繁。请稍后再试。')+'</span></div>';
  if(state.state==='unknown')detail='<div class="notice warning" role="status"><span>模型服务可能已收到请求，请核对这次测试，避免重复调用。</span></div>';
  document.getElementById('test-body').innerHTML='<p>使用已保存的配置发送一条简短文本请求，核对本次返回。实际调用可能产生费用。</p><div class="test-status '+state.state+'" role="status"><i class="dot"></i>'+labels[state.state]+'</div>'+detail+'<p class="demo-note" style="margin-top:17px">此处为模拟测试，不连接真实模型，不产生费用。</p>';
  document.getElementById('test-actions').innerHTML='<button class="btn" type="button" data-close="test-dialog">'+(running?'关闭观察':'关闭')+'</button>'+(state.state==='idle'?'<button class="btn primary" data-action="start-test">开始测试</button>':running?'<button class="btn" data-action="cancel-test">取消测试</button>':state.state==='unknown'?'<button class="btn primary" data-action="check-test">核对原测试</button>':['succeeded','failed','cancelled'].includes(state.state)?'<button class="btn primary" data-action="start-test">重新测试</button>':'');
}
function startTest(){
  const id=activeTest,state=tests.get(id);state.state='queued';state.outcome=testOutcome;testOutcome='success';document.getElementById('demo-test').value='success';renderTest();
  state.timer=setTimeout(()=>{state.state='running';if(activeTest===id)renderTest();state.timer=setTimeout(()=>{state.state=state.outcome==='success'?'succeeded':state.outcome==='unknown'?'unknown':'failed';if(state.state==='succeeded'){const model=models.find(m=>m.id===id);if(model?.format==='auto'){state.detectedFormat=(presets[model.providerId]||presets.custom).format;model.resolvedFormat=state.detectedFormat;updateRows()}}if(activeTest===id)renderTest()},850)},300);
}
function resetDemo(){models=structuredClone(initialModels);form=null;tests.forEach(t=>clearTimeout(t.timer));tests.clear();page=0;notice=null;saveBusy=false;discoverBusy=false;listState='ready';saveOutcome='success';testOutcome='success';directoryOutcome='success';rowOutcome='success';rowErrors.clear();busyRows.clear();document.getElementById('demo-directory').value='success';document.getElementById('demo-row').value='success';document.getElementById('demo-list').value='ready';document.getElementById('demo-save').value='success';document.getElementById('demo-test').value='success';renderList()}
document.addEventListener('click',event=>{
  const close=event.target.closest('[data-close]');if(close){closeDialog(close.dataset.close);return}
  if(form&&!event.target.closest('#model-combo')&&!event.target.closest('[data-action=discover]')){form.pickerOpen=false;renderModelOptions()}
  const button=event.target.closest('[data-action]');
  if(!event.target.closest('#more-menu')&&!event.target.closest('[data-action=more]'))hideMenu();
  if(!button||button.disabled)return;
  const action=button.dataset.action,id=button.dataset.id;
  if(action==='add')openForm(null);
  if(action==='edit')openForm(id);
  if(action==='test')showTest(id);
  if(action==='more')showMenu(id,button);
  if(action==='toggle')changeEnabled(id);
  if(action==='default'||action==='retry-default'){hideMenu();runRowAction('default',id)}
  if(action==='retry-row')runRowAction(rowErrors.get(id).kind,id);
  if(action==='delete'){const m=models.find(row=>row.id===id);hideMenu();confirmAction('删除文本模型','确定删除“'+m.name+'”？'+(m.isDefault?'删除后将没有默认文本模型。':'')+'已受理任务和历史产物会保留。','删除模型',()=>runRowAction('delete',id))}
  if(action==='retry-list'){listState='loading';updateRows();setTimeout(()=>{listState='ready';updateRows()},550)}
  if(action==='previous'){page--;updateRows()}
  if(action==='next'){page++;updateRows()}
  if(action==='back')backToList();
  if(action==='cancel')requestFormClose();
  if(action==='show-key'){const input=document.getElementById('api-key');input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'显示当前输入的密钥':'隐藏当前输入的密钥')}
  if(action==='toggle-models'){const input=document.getElementById('model-id'),open=input.getAttribute('aria-expanded')!=='true';input.focus();form.pickerSearch='';form.pickerOpen=open;form.pickerActive=-1;renderModelOptions()}
  if(action==='choose-model')chooseModel(Number(button.dataset.index));
  if(action==='discover')discover();
  if(action==='check-save'){const original=structuredClone(form);button.disabled=true;button.textContent='正在核对…';setTimeout(()=>settleSave(original,true),500)}
  if(action==='compare')showConflict();
  if(action==='start-test')startTest();
  if(action==='check-test'){tests.get(activeTest).state='succeeded';renderTest()}
  if(action==='cancel-test'){const test=tests.get(activeTest);clearTimeout(test.timer);test.state='cancelled';renderTest()}
});
document.addEventListener('submit',event=>{if(event.target.id==='model-form'){event.preventDefault();saveForm()}});

document.addEventListener('beforeinput',event=>{if(form?.keyMode==='keep'&&event.target.id==='api-key')event.target.select()});
document.addEventListener('pointerdown',event=>{if(event.target.closest('[data-action=choose-model]'))event.preventDefault()});
document.addEventListener('focusin',event=>{
  if(!form)return;
  if(event.target.id==='model-id'){form.pickerSearch='';form.pickerOpen=true;form.pickerActive=-1;renderModelOptions()}
  else if(!event.target.closest('#model-combo')){form.pickerOpen=false;renderModelOptions()}
  if(event.target.id==='api-key'&&form.keyMode==='keep')event.target.select();
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(!form||!el.closest('#model-form'))return;
  if(el.name&&['url','apiKey','modelId','name'].includes(el.name))form[el.name]=el.value;
  if(el.name==='apiKey'){
    form.keyMode=el.value?'replace':'clear';
    const eye=document.querySelector('[data-action=show-key]');eye.disabled=!el.value;eye.title='显示密钥';
  }
  if(['url','apiKey'].includes(el.name)){form.discovered=[];form.discoveryMessage='';form.pickerOpen=false;form.pickerSearch='';form.pickerActive=-1;renderModelOptions()}
  if(el.id==='model-id'){form.pickerSearch=el.value;form.pickerOpen=true;form.pickerActive=-1;renderModelOptions()}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='demo-save'){saveOutcome=el.value;return}
  if(el.id==='demo-test'){testOutcome=el.value;return}
  if(el.id==='demo-directory'){directoryOutcome=el.value;return}
  if(el.id==='demo-row'){rowOutcome=el.value;return}
  if(el.id==='demo-list'){
    form=null;page=0;notice=null;listState=['loading','error'].includes(el.value)?el.value:'ready';models=el.value==='empty'?[]:structuredClone(initialModels);
    if(el.value==='no-default')models.forEach(m=>m.isDefault=false);
    if(el.value==='many'){models=Array.from({length:27},(_,i)=>({...structuredClone(initialModels[i%3]),id:'many'+i,name:i===0?'用于长篇剧本人物关系与叙事结构讨论的主要创作模型':'文本模型 '+(i+1),modelId:i===0?'my-provider/long-context-story-model-2026-11-specific-version':'story-model-'+(i+1),isDefault:i===0,enabled:true}));}
    renderList();document.getElementById('review-panel').hidden=true;document.getElementById('review-toggle').setAttribute('aria-expanded','false');return;
  }
  if(!form)return;
  if(el.id==='provider'){form.providerId=el.value;const p=presets[el.value];if(p){form.url=p.url;form.format='auto';form.modelId='';form.discovered=[];form.discoveryMessage='';form.pickerOpen=false;form.pickerSearch='';form.pickerActive=-1}renderForm()}
  if(el.id==='model-enabled'){form.enabled=el.checked;if(!form.enabled)form.makeDefault=false;renderForm()}
  if(el.id==='make-default')form.makeDefault=el.checked;
  if(el.id==='api-format'){form.format=el.value;form.discovered=[];form.discoveryMessage='';form.pickerOpen=false;form.pickerSearch='';form.pickerActive=-1;renderForm();document.getElementById('api-format').focus()}
});

document.addEventListener('keydown',event=>{
  if(form&&event.target.id==='model-id'){
    const options=availableModels();
    if(['ArrowDown','ArrowUp'].includes(event.key)&&options.length){
      event.preventDefault();form.pickerOpen=true;form.pickerActive=(form.pickerActive+(event.key==='ArrowDown'?1:form.pickerActive<0?0:options.length-1)+options.length)%options.length;renderModelOptions();document.getElementById('model-option-'+form.pickerActive)?.scrollIntoView({block:'nearest'});return;
    }
    if(event.key==='Enter'&&form.pickerOpen&&form.pickerActive>=0){event.preventDefault();chooseModel(form.pickerActive);return}
    if(event.key==='Escape'&&form.pickerOpen){event.preventDefault();event.stopPropagation();form.pickerOpen=false;renderModelOptions();return}
  }

  if(event.key==='Escape'){if(!document.getElementById('more-menu').hidden){hideMenu();menuTrigger?.focus();event.preventDefault()}document.getElementById('review-panel').hidden=true;document.getElementById('review-toggle').setAttribute('aria-expanded','false')}
  if(event.target.closest('#more-menu')&&['ArrowDown','ArrowUp'].includes(event.key)){const items=[...document.querySelectorAll('#more-menu button:not(:disabled)')],index=items.indexOf(document.activeElement);items[(index+(event.key==='ArrowDown'?1:items.length-1))%items.length].focus();event.preventDefault()}
});
document.getElementById('review-toggle').onclick=()=>{const panel=document.getElementById('review-panel');panel.hidden=!panel.hidden;document.getElementById('review-toggle').setAttribute('aria-expanded',String(!panel.hidden))};
document.getElementById('reset-demo').onclick=()=>confirmAction('恢复演示数据','将清除本原型中的操作和填写，恢复三个示例模型。','恢复演示',resetDemo);
document.getElementById('nav-text').onclick=()=>{if(view==='form')backToList()};
document.getElementById('nav-config').onclick=()=>{if(view==='form')backToList()};
window.addEventListener('beforeunload',event=>{if(dirty()){event.preventDefault();event.returnValue=''}});
hydrateIcons();renderList();
</script>
</body>
