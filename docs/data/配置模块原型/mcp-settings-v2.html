<script>

function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(shapes[name]||shapes.text)+'</svg>'}
function hydrateIcons(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon));el.removeAttribute('data-icon')})}

let initialModels=[
  {id:'m1',name:'日常创作',provider:'DeepSeek',providerId:'deepseek',modelId:'deepseek-chat',url:'https://api.deepseek.com',format:'chat',hasKey:true,enabled:true,isDefault:true},
  {id:'m2',name:'剧本深度讨论',provider:'自定义服务',providerId:'custom',modelId:'story-model-pro',url:'https://api.example.com/v1',format:'responses',hasKey:true,enabled:true,isDefault:false},
  {id:'m3',name:'本地模型',provider:'本地服务',providerId:'local',modelId:'qwen3:32b',url:'http://localhost:11434/v1',format:'chat',hasKey:false,enabled:false,isDefault:false}

  openai:{name:'OpenAI',url:'https://api.openai.com/v1',format:'chat',models:['text-model','reasoning-model']},
  qwen:{name:'通义千问',url:'https://dashscope.aliyuncs.com/compatible-mode/v1',format:'chat',models:['qwen-plus','qwen3-max']},
  claude:{name:'Claude',url:'https://api.anthropic.com',format:'claude',models:['claude-text-model']},
  local:{name:'本地服务',url:'http://localhost:11434/v1',format:'chat',models:['qwen3:32b','local-text-model']},
  custom:{name:'自定义服务',url:'',format:'chat',models:['story-model-pro','story-model-fast']}
};
let formatNames={auto:'自动识别',chat:'OpenAI Chat Completions',responses:'OpenAI Responses',claude:'Claude Messages'};
let models=structuredClone(initialModels),view='list',listState='ready',page=0,notice=null,form=null,baseline='',formIssues={},saveBusy=false,discoverBusy=false;
let saveOutcome='success',testOutcome='success',confirmCallback=null,menuTrigger=null,dialogTrigger=null,highlightId='',serial=4;
const tests=new Map();
let activeTest=null,directoryOutcome='success',rowOutcome='success',listContext={page:0,scrollTop:0};
const rowErrors=new Map(),busyRows=new Set();
const content=document.getElementById('content');
const modelDialog=document.getElementById('model-dialog'),modelDialogContent=document.getElementById('model-dialog-content');
let modelTrigger=null;
function msg(text,type='success',action=''){return '<div class="notice '+type+'" role="'+(type==='error'?'alert':'status')+'"><span>'+esc(text)+'</span>'+action+'</div>'}
function renderList(){

function updateRows(){
  const area=document.getElementById('model-list'),count=document.getElementById('model-count');

  area.innerHTML='<div class="table-wrap"><table><caption class="sr-only">文本模型配置列表，全部为演示数据</caption><colgroup><col style="width:23%"><col style="width:23%"><col style="width:25%"><col style="width:12%"><col style="width:17%"></colgroup><thead><tr><th scope="col">模型名称</th><th scope="col">模型标识</th><th scope="col">接入信息</th><th scope="col">状态</th><th scope="col" style="text-align:right">操作</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="list-bottom"><span>仅显示你添加的文本模型</span>'+(pageCount>1?'<div class="paging"><span>第 '+(page+1)+' / '+pageCount+' 页</span><button class="btn small" data-action="previous" '+(!page?'disabled':'')+'>上一页</button><button class="btn small" data-action="next" '+(page===pageCount-1?'disabled':'')+'>下一页</button></div>':'')+'</div>';
}
function supportsAssistant(format){return Object.hasOwn(formatNames,format)}
function formatLabel(model){return model.format==='auto'&&model.resolvedFormat?'自动识别 · '+formatNames[model.resolvedFormat]:formatNames[model.format]}
function newForm(item){
  return {id:item?item.id:null,providerId:item?item.providerId:'',url:item?item.url:'',apiKey:'',keyMode:item&&item.hasKey?'keep':'replace',modelId:item?item.modelId:'',name:item?item.name:'',enabled:item?item.enabled:true,makeDefault:item?item.isDefault:!models.some(m=>m.isDefault&&m.enabled),format:item?item.format:'auto',state:'ready',discovered:[],discoveryMessage:'',pickerOpen:false,pickerSearch:'',pickerActive:-1};
}
function openForm(id){
  hideMenu();listContext={page,scrollTop:document.getElementById('main').scrollTop};modelTrigger=document.activeElement;
  form=newForm(id?models.find(m=>m.id===id):null);baseline=serializeForm(form);formIssues={};view='form';
  renderForm();modelDialog.showModal();modelDialog.querySelector('.modal-body').scrollTop=0;document.getElementById('provider').focus();
}
function fieldError(key){return formIssues[key]?'<p class="field-error" id="issue-'+key+'">'+esc(formIssues[key])+'</p>':''}
function invalid(key){return formIssues[key]?' aria-invalid="true" aria-describedby="issue-'+key+'"':''}
function keyField(){
  const saved=form.keyMode==='keep',value=saved?'••••••••':form.apiKey;
  return '<div class="input-line"><input id="api-key" name="apiKey" type="password" autocomplete="new-password"'+invalid('apiKey')+' value="'+esc(value)+'" placeholder="输入 API 密钥"><button class="btn icon" data-action="show-key" type="button" aria-label="显示当前输入的密钥" title="'+(saved?'已保存密钥不回显':'显示密钥')+'" '+(saved||!form.apiKey?'disabled':'')+'>'+icon('eye')+'</button></div>';
}
function modelIdentifierField(){
  return '<div class="input-line"><div class="model-combo" id="model-combo"><input id="model-id" name="modelId" type="text" role="combobox" aria-autocomplete="list" aria-controls="model-options" aria-expanded="false" value="'+esc(form.modelId)+'" placeholder="输入模型标识" autocomplete="off" spellcheck="false"'+invalid('modelId')+'><button class="model-picker-toggle" type="button" data-action="toggle-models" aria-label="展开模型列表" hidden>'+icon('chevron')+'</button><div class="model-options" id="model-options" role="listbox" aria-label="可用模型" hidden></div></div><button class="btn" type="button" data-action="discover" '+(discoverBusy?'disabled aria-busy="true"':'')+'>'+(discoverBusy?'获取中…':'获取模型')+'</button></div>';
}
function availableModels(){return form.discovered.filter(value=>value.toLowerCase().includes(form.pickerSearch.toLowerCase()))}
function renderModelOptions(){
  if(!form)return;
  const input=document.getElementById('model-id'),list=document.getElementById('model-options'),toggle=document.querySelector('[data-action=toggle-models]');
  const options=availableModels(),open=form.pickerOpen&&options.length>0&&!discoverBusy&&!saveBusy&&form.state!=='unknown';
  toggle.hidden=!form.discovered.length;toggle.disabled=discoverBusy||saveBusy;toggle.setAttribute('aria-label',open?'收起模型列表':'展开模型列表');toggle.setAttribute('aria-expanded',String(!!open));
  input.placeholder=form.discovered.length?'选择或输入模型标识':'输入模型标识';input.classList.toggle('has-models',!!form.discovered.length);input.setAttribute('aria-expanded',String(!!open));
  if(!open)form.pickerActive=-1;
  if(form.pickerActive>=options.length)form.pickerActive=options.length-1;
  list.hidden=!open;list.innerHTML=open?options.map((value,index)=>'<button type="button" class="model-option '+(index===form.pickerActive?'active':'')+'" id="model-option-'+index+'" role="option" tabindex="-1" aria-selected="'+(value===form.modelId)+'" data-action="choose-model" data-index="'+index+'">'+esc(value)+'</button>').join(''):'';
  if(open&&form.pickerActive>=0)input.setAttribute('aria-activedescendant','model-option-'+form.pickerActive);else input.removeAttribute('aria-activedescendant');
  const hint=document.getElementById('discovery-hint'),unmatched=form.pickerSearch&&form.discovered.length&&!options.length;
  hint.textContent=unmatched?'没有匹配的模型，可继续手动填写。':form.discoveryMessage;hint.hidden=!hint.textContent;
}
function chooseModel(index){
  form.modelId=availableModels()[index];document.getElementById('model-id').value=form.modelId;document.getElementById('model-id').focus();form.pickerOpen=false;form.pickerSearch='';form.pickerActive=-1;renderModelOptions();
}
function renderForm(){
  view='form';
  const blocked=saveBusy||form.state==='unknown',focusId=document.activeElement?.id,previousScroll=modelDialog.querySelector('.modal-body')?.scrollTop||0;
  let alert='';
  if(form.state==='failed')alert=msg('保存失败，填写内容已保留。','error');
  if(form.state==='unknown')alert=msg('保存结果待确认。','warning','<button class="btn small" type="button" data-action="check-save">核对保存结果</button>');
  if(form.state==='conflict')alert=msg('配置已更新，请核对最新内容。','warning','<button class="btn small" type="button" data-action="compare">查看最新配置</button>');
  const providers='<option value="">选择服务商</option>'+Object.entries(presets).map(([id,p])=>'<option value="'+id+'" '+(form.providerId===id?'selected':'')+'>'+p.name+'</option>').join('');
  const formats=Object.entries(formatNames).map(([id,label])=>'<option value="'+id+'" '+(form.format===id?'selected':'')+'>'+label+'</option>').join('');
  modelDialogContent.innerHTML=`<form id="model-form" novalidate>
    <div class="modal-head"><h3 id="model-dialog-title">${form.id?'编辑文本模型':'新增文本模型'}</h3><button class="btn quiet icon" type="button" data-action="cancel" aria-label="关闭模型弹窗" ${blocked?'disabled':''}>${icon('x')}</button></div>
    <div class="modal-body model-body">${alert}<fieldset class="editor-section" ${blocked?'disabled':''}>
      <div class="field-pair"><div class="field"><label for="provider">服务商</label><select id="provider" name="providerId"${invalid('providerId')}>${providers}</select>${fieldError('providerId')}</div><div class="field"><label for="api-format">接口类型</label><select id="api-format" name="format">${formats}</select></div></div>
      <div class="field"><label for="service-url">服务地址</label><input id="service-url" name="url" type="url" value="${esc(form.url)}" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false"${invalid('url')}>${fieldError('url')}</div>
      <div class="field"><label for="api-key">API 密钥<span class="optional">免鉴权可留空</span></label>${keyField()}${fieldError('apiKey')}</div>
      <div class="field"><label for="model-id">模型标识</label>${modelIdentifierField()}${fieldError('modelId')}<p class="field-hint" role="status" id="discovery-hint" hidden></p></div>
      <div class="field"><label for="display-name">显示名称<span class="optional">选填</span></label><input id="display-name" name="name" type="text" maxlength="120" value="${esc(form.name)}" placeholder="留空使用模型标识"></div>
      <div class="form-options"><label class="check-row"><input id="model-enabled" name="enabled" type="checkbox" ${form.enabled?'checked':''}>启用模型</label><label class="check-row ${form.enabled?'':'disabled'}"><input id="make-default" name="makeDefault" type="checkbox" ${form.enabled&&form.makeDefault?'checked':''} ${form.enabled?'':'disabled'}>设为默认</label></div>
    </fieldset></div>
    <div class="modal-actions"><button class="btn" type="button" data-action="cancel" ${blocked?'disabled':''}>取消</button><button class="btn primary" type="submit" ${blocked||form.state==='conflict'?'disabled':''} aria-busy="${saveBusy}">${saveBusy?'保存中…':'保存'}</button></div>
  </form>`;
  modelDialog.querySelector('.modal-body').scrollTop=previousScroll;
  if(focusId)modelDialogContent.querySelector('#'+focusId)?.focus({preventScroll:true});
  renderModelOptions();
}
function serializeForm(value){const data=structuredClone(value);for(const key of ['advanced','compatibilityOpen','discovered','discoveryMessage','pickerOpen','pickerSearch','pickerActive','state'])delete data[key];return JSON.stringify(data)}
function dirty(){return form&&serializeForm(form)!==baseline}
function restoreListPosition(){requestAnimationFrame(()=>document.getElementById('main').scrollTop=listContext.scrollTop)}
function backToList(){requestFormClose()}
function requestFormClose(){
  if(!form||saveBusy||form.state==='unknown')return;
  const discard=()=>{form=null;notice=null;renderList();restoreListPosition()};
  if(dirty())confirmAction('放弃本次修改','未保存的填写将被清除。','放弃修改',discard);else discard();
}
function confirmAction(title,body,label,callback){
  dialogTrigger=document.activeElement;confirmCallback=callback;
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-body').innerHTML='<p>'+esc(body)+'</p>';
  document.getElementById('confirm-yes').textContent=label;
  document.getElementById('confirm-dialog').showModal();document.getElementById('confirm-cancel').focus();
}
function restoreTrigger(trigger){if(trigger?.isConnected){trigger.focus();return}const action=trigger?.dataset.action,id=trigger?.dataset.id;if(action)content.querySelector('[data-action="'+action+'"]'+(id?'[data-id="'+id+'"]':''))?.focus()}
function closeDialog(id){document.getElementById(id).close()}
modelDialog.addEventListener('cancel',event=>{event.preventDefault();requestFormClose()});
modelDialog.addEventListener('close',()=>{restoreTrigger(modelTrigger);modelTrigger=null});
document.querySelectorAll('dialog:not(#model-dialog)').forEach(el=>el.addEventListener('close',()=>{restoreTrigger(dialogTrigger);dialogTrigger=null}));
document.getElementById('confirm-cancel').onclick=()=>closeDialog('confirm-dialog');
document.getElementById('confirm-yes').onclick=()=>{const run=confirmCallback;closeDialog('confirm-dialog');if(run)run()};
function hideMenu(){
  document.getElementById('more-menu').hidden=true;
  if(menuTrigger&&menuTrigger.isConnected)menuTrigger.setAttribute('aria-expanded','false');
}
function showMenu(id,button){
  hideMenu();menuTrigger=button;button.setAttribute('aria-expanded','true');
  const m=models.find(row=>row.id===id),menu=document.getElementById('more-menu');
  menu.innerHTML='<button class="menu-item" role="menuitem" data-action="default" data-id="'+id+'" '+(!m.enabled||m.isDefault||!supportsAssistant(m.format)?'disabled':'')+'>'+icon('star')+(m.isDefault?'已是默认模型':!m.enabled?'启用后可设为默认':!supportsAssistant(m.format)?'当前接口仅用于文本生成':'设为默认')+'</button><div class="menu-line"></div><button class="menu-item danger" role="menuitem" data-action="delete" data-id="'+id+'">'+icon('trash')+'删除模型</button>';
  menu.hidden=false;const box=button.getBoundingClientRect();menu.style.right=Math.max(12,innerWidth-box.right)+'px';menu.style.top=(box.bottom+7)+'px';
  if(menu.getBoundingClientRect().bottom>innerHeight-10)menu.style.top=(box.top-menu.offsetHeight-7)+'px';
  menu.querySelector('button:not(:disabled)').focus();
}
function runRowAction(kind,id){
  const model=models.find(row=>row.id===id);if(!model||busyRows.has(id))return;
  const outcome=rowOutcome;rowOutcome='success';document.getElementById('demo-row').value='success';busyRows.add(id);rowErrors.delete(id);updateRows();
  setTimeout(()=>{
    busyRows.delete(id);
    if(outcome==='failed'){rowErrors.set(id,{kind,text:kind==='default'?'设置默认失败，原默认模型保持不变。':kind==='delete'?'删除未成功，该模型仍保留。':'启用状态未能保存，已保留原状态。'});updateRows();return}
    if(kind==='toggle'){model.enabled=!model.enabled;if(!model.enabled)model.isDefault=false;notice={text:(model.enabled?'已启用':'已停用')+'“'+model.name+'”。',type:'success'}}

async function mediaSample(kind){
  if(!demoMedia[kind])demoMedia[kind]=kind==='image'?sampleImage():kind==='audio'?sampleAudio():sampleVideo();
  return await demoMedia[kind];
}
showTest=function(id){
  approvedTextPage.showTest(id);tests.get(id).kind=activeKind;
  if(activeKind!=='text')document.getElementById('test-title').textContent='测试'+kindNames[activeKind]+'模型 · '+models.find(model=>model.id===id).name;
};
renderTest=function(){
  const state=tests.get(activeTest),kind=state.kind||activeKind;
  if(kind==='text'){approvedTextPage.renderTest();return}
  const running=['queued','running'].includes(state.state),labels={idle:'尚未开始',queued:'排队中',running:'生成中',succeeded:'已收到媒体结果',failed:'测试失败',unknown:'受理结果待核对',cancelled:'测试已取消'};
  let detail='';
  if(state.state==='succeeded'){
    const media=kind==='image'?'<img class="media-test-output" src="'+state.preview+'" alt="模拟图像结果">':kind==='video'?'<video class="media-test-output" src="'+state.preview+'" controls preload="metadata" aria-label="模拟视频结果"></video>':'<audio class="media-test-audio" src="'+state.preview+'" controls preload="metadata" aria-label="模拟音频结果"></audio>';
    detail=media+'<span class="test-result-note">原型示例</span>';
  }
  if(state.state==='failed')detail=msg(state.outcome==='auth'?'密钥无效或无模型访问权限，请编辑配置。':state.outcome==='protocol'?'接口或模型不支持当前测试，请核对接口类型。':'模型服务请求过于频繁，请稍后再试。','error');
  if(state.state==='unknown')detail=msg('模型服务可能已受理，请核对原测试。','warning');
  document.getElementById('test-body').innerHTML='<p>使用已保存的配置生成一份'+kindNames[kind]+'样例。实际调用可能产生费用。</p><div class="test-status '+state.state+'" role="status"><i class="dot"></i>'+labels[state.state]+'</div>'+detail+'<p class="demo-note" style="margin-top:16px">本原型仅模拟，不连接模型服务。</p>';
  document.getElementById('test-actions').innerHTML='<button class="btn" type="button" data-close="test-dialog">'+(running?'关闭观察':'关闭')+'</button>'+(state.state==='idle'?'<button class="btn primary" data-action="start-test">开始测试</button>':running?'<button class="btn" data-action="cancel-test">取消测试</button>':state.state==='unknown'?'<button class="btn primary" data-action="check-test">核对原测试</button>':'<button class="btn primary" data-action="start-test">重新测试</button>');
};
startTest=function(){
  const id=activeTest,state=tests.get(id),kind=activeKind,model=models.find(item=>item.id===id),selectedPresets=presets;
  state.kind=kind;state.state='queued';state.outcome=testOutcome;testOutcome='success';document.getElementById('demo-test').value='success';renderTest();
  const finish=async()=>{
    if(state.outcome==='success'&&kind!=='text')state.preview=await mediaSample(kind);
    if(tests.get(id)!==state||state.state==='cancelled')return;
    state.state=state.outcome==='success'?'succeeded':state.outcome==='unknown'?'unknown':'failed';
    if(state.state==='succeeded'&&model.format==='auto'){state.detectedFormat=selectedPresets[model.providerId]?.format;model.resolvedFormat=state.detectedFormat;if(activeKind===kind)updateRows()}
    if(activeTest===id)renderTest();
  };
  state.timer=setTimeout(()=>{state.state='running';if(activeTest===id)renderTest();state.timer=setTimeout(finish,600)},250);
};
document.addEventListener('click',event=>{
  if(event.target.closest('[data-action=check-test]')&&tests.get(activeTest)?.kind!=='text'){
    const state=tests.get(activeTest);state.state='running';renderTest();mediaSample(state.kind).then(preview=>{state.preview=preview;state.state='succeeded';if(tests.get(activeTest)===state)renderTest()});
  }
});

const mcpBase={enterAssistant,switchCategory,renderList,setAssistantReview,reset:document.getElementById('reset-demo').onclick};
const mcpEndpoint='https://studio.example.com/mcp/';
const mcpDate=(days)=>new Date(Date.now()+days*86400000).toISOString();
const mcpExamples=[{id:'7101',name:'Cursor',hint:'sdmcp_••••b72d',workbench:true,media:true,expires:mcpDate(30),ips:[],created:mcpDate(-5)},{id:'7102',name:'Claude Desktop',hint:'sdmcp_••••a91f',workbench:false,media:false,expires:mcpDate(-3),ips:[],created:mcpDate(-33)}];
let mcpActive=false,mcpTokens=structuredClone(mcpExamples),mcpListState='ready',mcpCreateOutcome='success',mcpRevokeOutcome='success',mcpCopyOutcome='normal',mcpMode=null,mcpDraft=null,mcpBusy=false,mcpProblem=null,mcpSecret=null,mcpRecord=null,mcpOrigin=null,mcpFlashTimer=null,mcpSequence=7200;
Object.assign(shapes,{copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'});
const mcpNav=document.getElementById('nav-mcp'),mcpDialog=document.getElementById('mcp-dialog');
document.getElementById('mcp-close').innerHTML=icon('x');
const mcpPermission=token=>token.workbench?(token.media?'可修改及生成':'可修改'):'只读';
const mcpExpired=token=>!!token.expires&&Date.parse(token.expires)<=Date.now();
const mcpFormatDate=value=>value?new Date(value).toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}):'长期有效';
function mcpFlash(message){clearTimeout(mcpFlashTimer);const node=mcpDialog.open?document.getElementById('mcp-copy-message'):document.getElementById('mcp-flash');if(!node)return;node.textContent=message;node.hidden=false;mcpFlashTimer=setTimeout(()=>{node.hidden=true},2200)}
function mcpReview(){for(const child of document.getElementById('review-panel').children)child.hidden=child.id!=='mcp-review'}
setAssistantReview=function(){if(mcpActive)mcpReview();else{mcpBase.setAssistantReview();document.getElementById('mcp-review').hidden=true}};
function leaveMcp(){mcpActive=false;mcpNav.classList.remove('current');mcpNav.removeAttribute('aria-current')}
enterAssistant=function(key){leaveMcp();mcpBase.enterAssistant(key)};
switchCategory=function(kind){leaveMcp();mcpBase.switchCategory(kind)};
renderList=function(){if(mcpActive)renderMcp();else mcpBase.renderList()};
function enterMcp(){if(form)return;assistantActive=false;mcpActive=true;updateAssistantNavigation();for(const id of ['nav-text','nav-media']){document.getElementById(id).classList.remove('current');document.getElementById(id).removeAttribute('aria-current')}mcpNav.classList.add('current');mcpNav.setAttribute('aria-current','page');history.replaceState(null,'','#mcp');renderMcp();mcpReview()}
mcpNav.onclick=enterMcp;
function renderMcp(){
  document.title='配置 · MCP 接入 — 页面原型';hideMenu();
  if(mcpListState==='loading'){content.innerHTML='<div class="assistant-skeleton" role="status" aria-label="正在读取 MCP 令牌"><i class="sk sk-row"></i><i class="sk sk-row"></i><i class="sk sk-row"></i></div>';return}
  if(mcpListState==='error'){content.innerHTML='<div class="assistant-message" role="alert"><span>MCP 令牌读取失败</span><button class="btn" data-mcp-action="reload">重新读取</button></div>';return}
  const tokens=mcpListState==='empty'?[]:mcpTokens;
  content.innerHTML='<section class="mcp-settings" aria-label="MCP 接入"><div class="mcp-endpoint"><label for="mcp-endpoint">接入地址</label><div class="mcp-endpoint-box"><input id="mcp-endpoint" readonly value="'+mcpEndpoint+'"><button class="btn quiet icon" type="button" data-mcp-action="copy-address" aria-label="复制接入地址" title="复制接入地址">'+icon('copy')+'</button></div></div><div class="mcp-toolbar"><span>共 '+tokens.length+' 个令牌</span><button class="btn primary" data-mcp-action="create">'+icon('plus')+'创建令牌</button></div>'+(!tokens.length?'<div class="empty"><div class="empty-mark">'+icon('plug')+'</div><h3>还没有 MCP 令牌</h3><p>创建令牌后，可从外部客户端接入工作台。</p></div>':'<div class="mcp-table-wrap"><table class="mcp-table"><caption class="sr-only">MCP 令牌列表，全部为演示数据</caption><thead><tr><th>名称</th><th>MCP 令牌</th><th>授权范围</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>'+tokens.map(token=>'<tr><td><strong title="'+esc(token.name)+'">'+esc(token.name)+'</strong></td><td><span class="mcp-token-hint">'+esc(token.hint)+'</span></td><td>'+mcpPermission(token)+'</td><td>'+mcpFormatDate(token.expires)+'</td><td><span class="mcp-state'+(!mcpExpired(token)?' active':'')+'">'+(mcpExpired(token)?'已过期':'有效')+'</span></td><td><div class="mcp-token-actions"><button class="btn quiet icon" data-mcp-action="details" data-token-id="'+token.id+'" aria-label="查看授权：'+esc(token.name)+'" title="查看授权">'+icon('eye')+'</button><button class="btn quiet icon" data-mcp-action="revoke" data-token-id="'+token.id+'" aria-label="撤销令牌：'+esc(token.name)+'" title="撤销令牌">'+icon('trash')+'</button></div></td></tr>').join('')+'</tbody></table></div>')+'</section>';
}
function openMcp(mode,record=null){mcpOrigin=document.activeElement;mcpMode=mode;mcpRecord=record;mcpProblem=null;if(mode==='create')mcpDraft={name:'',workbench:false,media:false,expiry:'90',ips:''};renderMcpDialog();mcpDialog.showModal();document.getElementById(mode==='create'?'mcp-name':'mcp-close')?.focus()}
function closeMcp(){if(mcpBusy)return;mcpDialog.close();mcpSecret=null;mcpRecord=null;mcpDraft=null;mcpMode=null;mcpProblem=null;document.getElementById('mcp-dialog-body').replaceChildren();document.getElementById('mcp-dialog-actions').replaceChildren()}
function mcpDialogNotice(){if(!mcpProblem)return '';const action=mcpProblem.kind==='unknown-create'?'<button class="btn small" type="button" data-mcp-action="check-create">核对创建结果</button>':mcpProblem.kind==='unknown-revoke'?'<button class="btn small" type="button" data-mcp-action="check-revoke">核对撤销结果</button>':'';return msg(mcpProblem.text,mcpProblem.kind.startsWith('unknown')?'warning':'error',action)}
function mcpToggle(key,label){return '<button class="switch" type="button" role="switch" aria-label="'+label+'" aria-checked="'+mcpDraft[key]+'" data-mcp-toggle="'+key+'"'+(mcpBusy?' disabled':'')+'></button>'}
function renderMcpDialog(){
  const body=document.getElementById('mcp-dialog-body'),actions=document.getElementById('mcp-dialog-actions');document.getElementById('mcp-close').disabled=mcpBusy;
  if(mcpMode==='create'){
    document.getElementById('mcp-dialog-title').textContent='创建 MCP 令牌';const locked=mcpBusy||mcpProblem?.kind==='unknown-create';
    body.innerHTML=mcpDialogNotice()+'<form id="mcp-create-form"><div class="field"><label for="mcp-name">名称</label><input id="mcp-name" maxlength="80" placeholder="例如：Cursor" value="'+esc(mcpDraft.name)+'"'+(locked?' readonly':'')+'></div><div class="mcp-permissions"><p>适用于账号有权访问的全部项目。</p><div class="assistant-row"><span>工作台操作</span>'+mcpToggle('workbench','工作台操作')+'</div>'+(mcpDraft.workbench?'<div class="permission-children"><div class="assistant-row"><span>允许生成图片、视频、音频</span>'+mcpToggle('media','允许生成图片、视频、音频')+'</div></div>':'')+'</div><div class="field mcp-expiry"><label for="mcp-expiry">有效期</label><select id="mcp-expiry"'+(locked?' disabled':'')+'><option value="30">30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="never">长期有效</option></select></div><details class="mcp-source-limit"'+(mcpDraft.ips?' open':'')+'><summary>'+icon('chevron')+'来源限制</summary><div class="field"><label for="mcp-ips">允许的 IP / CIDR</label><textarea id="mcp-ips" placeholder="留空不限来源，每行一项"'+(locked?' readonly':'')+'>'+esc(mcpDraft.ips)+'</textarea></div></details></form>';
    document.getElementById('mcp-expiry').value=mcpDraft.expiry;
    if(locked)body.querySelectorAll('[data-mcp-toggle]').forEach(button=>{button.disabled=true});
    actions.innerHTML='<button class="btn" type="button" data-mcp-action="close"'+(mcpBusy?' disabled':'')+'>取消</button><button class="btn primary" type="submit" form="mcp-create-form" id="mcp-create-submit"'+(locked?' disabled':'')+' aria-busy="'+mcpBusy+'">'+(mcpBusy?'创建中…':'创建令牌')+'</button>';
    document.getElementById('mcp-create-form').onsubmit=event=>{event.preventDefault();createMcpToken()};return;
  }
  if(mcpMode==='secret'){
    document.getElementById('mcp-dialog-title').textContent='令牌已创建';body.innerHTML='<div class="mcp-once"><p>完整密钥仅显示一次，关闭后无法再次查看。</p><div class="mcp-secret-line"><input id="mcp-secret" aria-label="完整 MCP 密钥" readonly value="'+esc(mcpSecret)+'"><button class="btn quiet icon" data-mcp-action="copy-secret" aria-label="复制密钥" title="复制密钥">'+icon('copy')+'</button></div><p id="mcp-copy-message" role="status" hidden></p><pre class="mcp-connection-info" aria-label="连接方式">Streamable HTTP\n'+mcpEndpoint+'\nAuthorization: Bearer &lt;你的令牌&gt;</pre></div>';actions.innerHTML='<button class="btn" data-mcp-action="copy-connection">复制接入信息</button><button class="btn primary" data-mcp-action="close">完成</button>';return;
  }
  if(mcpMode==='lost'){
    document.getElementById('mcp-dialog-title').textContent='未取得完整密钥';body.innerHTML=mcpDialogNotice()+'<p>列表中发现新令牌，但完整密钥未取得。核对后可撤销并重新创建。</p><dl class="mcp-detail"><dt>名称</dt><dd>'+esc(mcpRecord.name)+'<small>'+esc(mcpRecord.hint)+'</small></dd><dt>项目范围</dt><dd>账号有权访问的全部项目</dd><dt>权限</dt><dd>'+mcpPermission(mcpRecord)+'</dd></dl>';actions.innerHTML='<button class="btn" data-mcp-action="close"'+(mcpBusy?' disabled':'')+'>关闭</button><button class="btn primary" data-mcp-action="replace-lost"'+(mcpBusy?' disabled':'')+'>'+(mcpBusy?'正在撤销…':'撤销并重新创建')+'</button>';return;
  }
  if(mcpMode==='revoke'){
    document.getElementById('mcp-dialog-title').textContent='撤销令牌';body.innerHTML=mcpDialogNotice()+'<p>撤销「'+esc(mcpRecord.name)+'」后，使用此令牌的客户端将无法继续访问。</p><p>已提交的生成任务继续完成。</p>';actions.innerHTML='<button class="btn" data-mcp-action="close"'+(mcpBusy?' disabled':'')+'>取消</button><button class="btn danger-fill" data-mcp-action="confirm-revoke"'+(mcpBusy||mcpProblem?.kind==='unknown-revoke'?' disabled':'')+'>'+(mcpBusy?'正在撤销…':'撤销令牌')+'</button>';return;
  }
  document.getElementById('mcp-dialog-title').textContent='令牌授权';const token=mcpRecord;
  body.innerHTML='<dl class="mcp-detail"><dt>名称</dt><dd>'+esc(token.name)+'</dd><dt>MCP 令牌</dt><dd>'+esc(token.hint)+'</dd><dt>项目范围</dt><dd>账号有权访问的全部项目</dd><dt>权限</dt><dd>'+mcpPermission(token)+'<small>包含项目资料的只读访问</small></dd><dt>有效期</dt><dd>'+mcpFormatDate(token.expires)+'</dd><dt>来源限制</dt><dd>'+esc(token.ips.join('\n')||'不限来源')+'</dd><dt>创建时间</dt><dd>'+mcpFormatDate(token.created)+'</dd></dl>';actions.innerHTML='<button class="btn" data-mcp-action="close">关闭</button>';
}
function validMcpIp(value){const parts=value.split('/'),address=parts[0];if(parts.length>2)return false;if(address.includes(':')){try{new URL('http://['+address+']/')}catch{return false}return parts.length===1||/^\d+$/.test(parts[1])&&Number(parts[1])<=128}return address.split('.').length===4&&address.split('.').every(part=>/^\d{1,3}$/.test(part)&&Number(part)<=255)&&(parts.length===1||/^\d+$/.test(parts[1])&&Number(parts[1])<=32)}
async function createMcpToken(){
  if(mcpBusy||mcpProblem?.kind==='unknown-create')return;
  const ips=mcpDraft.ips.split(/[\s,，]+/).filter(Boolean);let error='',field='mcp-name';if(!mcpDraft.name.trim())error='请填写令牌名称。';else if(ips.some(ip=>!validMcpIp(ip))){error='请填写有效的 IP 或 CIDR。';field='mcp-ips'}
  if(error){mcpProblem={kind:'validation',text:error};renderMcpDialog();if(field==='mcp-ips')document.querySelector('.mcp-source-limit').open=true;document.getElementById(field).focus();return}
  const outcome=mcpCreateOutcome;mcpCreateOutcome='success';document.getElementById('demo-mcp-create').value='success';mcpBusy=true;mcpProblem=null;renderMcpDialog();await new Promise(resolve=>setTimeout(resolve,500));mcpBusy=false;
  if(outcome==='failed'){mcpProblem={kind:'failed',text:'创建失败，填写已保留。请重试。'};renderMcpDialog();return}
  const id=String(++mcpSequence),token={id,name:mcpDraft.name.trim(),hint:'sdmcp_••••'+id,workbench:mcpDraft.workbench,media:mcpDraft.workbench&&mcpDraft.media,expires:mcpDraft.expiry==='never'?null:mcpDate(Number(mcpDraft.expiry)),ips,created:mcpDate(0)};
  mcpTokens.unshift(token);mcpRecord=token;mcpListState='ready';renderMcp();
  if(outcome==='unknown'){mcpProblem={kind:'unknown-create',text:'尚未确认创建结果，请先核对，避免重复创建。'};renderMcpDialog();return}
  mcpSecret='sdmcp_DEMO_ONLY_'+crypto.randomUUID().replaceAll('-','');mcpMode='secret';renderMcpDialog();document.getElementById('mcp-secret').focus();
}
async function revokeMcpToken(replace=false){
  if(mcpBusy)return;const outcome=mcpRevokeOutcome;mcpRevokeOutcome='success';document.getElementById('demo-mcp-revoke').value='success';mcpBusy=true;mcpProblem=null;renderMcpDialog();await new Promise(resolve=>setTimeout(resolve,450));mcpBusy=false;
  if(outcome==='failed'){mcpProblem={kind:'failed',text:'撤销失败，令牌仍保留。请重试。'};renderMcpDialog();return}
  if(outcome==='unknown'){mcpProblem={kind:'unknown-revoke',text:'尚未确认撤销结果，请先核对。'};renderMcpDialog();return}
  mcpTokens=mcpTokens.filter(token=>token.id!==mcpRecord.id);renderMcp();
  if(replace){mcpRecord=null;mcpMode='create';mcpProblem=null;renderMcpDialog();document.getElementById('mcp-name').focus()}else{closeMcp();mcpFlash('令牌已撤销')}
}
async function copyMcp(value,inputId){try{if(mcpCopyOutcome==='failed')throw new Error('demo-copy');await navigator.clipboard.writeText(value);mcpFlash('已复制')}catch{const input=document.getElementById(inputId);input?.focus();input?.select();mcpFlash('复制失败，请手动选择并复制')}}
document.addEventListener('input',event=>{if(event.target.id==='mcp-name')mcpDraft.name=event.target.value;if(event.target.id==='mcp-ips')mcpDraft.ips=event.target.value});
document.addEventListener('change',event=>{if(event.target.id==='mcp-expiry')mcpDraft.expiry=event.target.value});
document.addEventListener('click',event=>{
  const toggle=event.target.closest('[data-mcp-toggle]');if(toggle&&!toggle.disabled){mcpDraft[toggle.dataset.mcpToggle]=!mcpDraft[toggle.dataset.mcpToggle];const key=toggle.dataset.mcpToggle;renderMcpDialog();document.querySelector('[data-mcp-toggle="'+key+'"]').focus();return}
  const button=event.target.closest('[data-mcp-action]');if(!button||button.disabled)return;const action=button.dataset.mcpAction;
  if(action==='create')openMcp('create');if(action==='close')closeMcp();if(action==='details'||action==='revoke')openMcp(action==='details'?'details':'revoke',mcpTokens.find(token=>token.id===button.dataset.tokenId));
  if(action==='copy-address')copyMcp(mcpEndpoint,'mcp-endpoint');if(action==='copy-secret')copyMcp(mcpSecret,'mcp-secret');if(action==='copy-connection')copyMcp('Streamable HTTP\n'+mcpEndpoint+'\nAuthorization: Bearer '+mcpSecret,'mcp-secret');
  if(action==='confirm-revoke')revokeMcpToken();if(action==='replace-lost')revokeMcpToken(true);
  if(action==='check-create'){mcpProblem=null;mcpMode='lost';renderMcpDialog()}
  if(action==='check-revoke'){mcpTokens=mcpTokens.filter(token=>token.id!==mcpRecord.id);renderMcp();if(mcpMode==='lost'){mcpMode='create';mcpRecord=null;mcpProblem=null;renderMcpDialog()}else closeMcp()}
  if(action==='reload'){mcpListState='loading';renderMcp();setTimeout(()=>{mcpListState='ready';renderMcp()},450)}
});
mcpDialog.addEventListener('cancel',event=>{event.preventDefault();closeMcp()});mcpDialog.addEventListener('close',()=>{if(mcpOrigin?.isConnected)mcpOrigin.focus();else document.querySelector('[data-mcp-action=create]')?.focus();mcpOrigin=null});
mcpDialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const nodes=[...mcpDialog.querySelectorAll('button:not(:disabled),input:not(:disabled):not([readonly]),textarea:not([readonly]),select:not(:disabled),summary')].filter(el=>el.getClientRects().length);if(event.shiftKey&&document.activeElement===nodes[0]){event.preventDefault();nodes.at(-1)?.focus()}else if(!event.shiftKey&&document.activeElement===nodes.at(-1)){event.preventDefault();nodes[0]?.focus()}});
document.getElementById('demo-mcp-list').onchange=event=>{mcpListState=event.target.value;renderMcp()};
document.getElementById('demo-mcp-create').onchange=event=>{mcpCreateOutcome=event.target.value};document.getElementById('demo-mcp-revoke').onchange=event=>{mcpRevokeOutcome=event.target.value};document.getElementById('demo-mcp-copy').onchange=event=>{mcpCopyOutcome=event.target.value};
document.getElementById('reset-demo').onclick=()=>{if(!mcpActive){mcpBase.reset();return}confirmAction('恢复 MCP 演示','清除 MCP 演示修改，恢复两条示例令牌。','恢复演示',()=>{mcpTokens=structuredClone(mcpExamples);mcpListState='ready';mcpCreateOutcome='success';mcpRevokeOutcome='success';mcpCopyOutcome='normal';for(const [id,value] of [['demo-mcp-list','ready'],['demo-mcp-create','success'],['demo-mcp-revoke','success'],['demo-mcp-copy','normal']])document.getElementById(id).value=value;renderMcp()})};
window.addEventListener('beforeunload',event=>{if(mcpBusy||mcpSecret){event.preventDefault();event.returnValue=''}});
hydrateIcons();enterMcp();

</script>
