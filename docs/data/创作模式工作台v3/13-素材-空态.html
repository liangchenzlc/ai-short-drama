<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>素材创作 · 空态</title>
<link rel="stylesheet" href="board3.css">
<style>
.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #0e0e0f; border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
.stage-head { flex: 0 0 46px; height: 46px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--hair-2); }
.stage-head h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.canvas { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 14px;
  background: radial-gradient(62% 58% at 50% 32%, #1a1b20 0%, #0b0b0d 72%); }
.shot-wrap { position: relative; }
.shot { border-radius: 10px; border: 1px solid #34343a; box-shadow: 0 20px 48px rgb(0 0 0 / 58%); }
.shot .corner-l { position: absolute; left: 9px; top: 9px; padding: 2px 7px; border-radius: 4px; background: rgb(0 0 0 / 58%); border: 1px solid rgb(255 255 255 / 13%); font-size: 9.5px; letter-spacing: .06em; color: #e3e3ea; }
.shot .corner-r { position: absolute; right: 9px; top: 9px; display: flex; gap: 4px; }
.cands { width: 560px; display: grid; gap: 7px; }
.cands-head { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #7f7f88; }
.cands-head button { margin-left: auto; color: #b9b9c2; font-size: 10.5px; }
.cand-row { display: flex; gap: 7px; align-items: stretch; }
.cand { position: relative; width: 66px; height: 84px; border-radius: 7px; border: 1px solid #2f2f35; }
.cand.on { border-color: #d8d8de; box-shadow: 0 0 0 2px rgb(245 245 245 / 14%); }
.cand .tagcur { position: absolute; left: 4px; bottom: 4px; padding: 0 4px; height: 14px; display: inline-flex; align-items: center; border-radius: 3px; background: rgb(0 0 0 / 65%); font-size: 8.5px; color: #e6e6ec; }
.cand-add { width: 66px; height: 84px; display: grid; place-items: center; gap: 2px; border: 1px dashed #3a3a40; border-radius: 7px; color: #6f6f79; font-size: 9.5px; }
.stage-foot { flex: 0 0 34px; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #131313; border-top: 1px solid var(--hair-2); font-size: 10.5px; color: #8a8a93; }
.stage-foot .sep { width: 1px; height: 11px; background: #2f2f2f; }
.filters { flex: 0 0 auto; display: grid; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--hair-2); }
.search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid #333; border-radius: 6px; color: #6f6f79; font-size: 11px; }
.tabs { display: flex; gap: 4px; }
.tab { height: 22px; padding: 0 7px; display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; color: #8b8b94; font-size: 10.5px; }
.tab.on { background: #2b2b2b; color: #f0f0f4; }
.tab small { font-family: var(--mono); font-size: 9.5px; color: #6f6f79; }
.tab.on small { color: #b9b9c2; }
.asset-th { width: 38px; height: 38px; flex: none; border-radius: 6px; border: 1px solid #303030; }
.foot { flex: 0 0 38px; height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-top: 1px solid var(--hair-2); }
.inp { height: 30px; display: flex; align-items: center; padding: 0 9px; border: 1px solid #333; border-radius: 7px; background: #151515; color: #e4e4ea; font-size: 12.5px; }
.inp.ghosted { color: #6f6f79; }
.anchor-row { display: flex; gap: 5px; flex-wrap: wrap; }
.anchor { height: 22px; padding: 0 7px; display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; background: #1c1c20; border: 1px solid #303036; color: #c3c3cb; font-size: 10.5px; }
.ang-menu { position: absolute; right: 0; top: 34px; width: 168px; padding: 5px; border: 1px solid #3a3a3a; border-radius: 8px; background: #1e1e1e; box-shadow: 0 14px 30px rgb(0 0 0 / 55%); z-index: 5; }
.ang-menu button { display: flex; align-items: center; gap: 7px; width: 100%; height: 28px; padding: 0 7px; border-radius: 5px; color: #d3d3da; font-size: 11.5px; }
.ang-menu button:hover { background: #2b2b2b; }
.ang-menu .k { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: #6f6f79; }
.fig { position: absolute; left: 50%; bottom: 0; height: 76%; width: auto; transform: translateX(-50%); fill: rgba(255,255,255,.12); }
.fig circle { fill: rgba(255,255,255,.16); }
.win { position: absolute; right: 13%; top: 14%; width: 32%; height: 54%; border: 2px solid rgba(255,255,255,.13); background: linear-gradient(180deg, rgba(255,214,158,.13), rgba(255,214,158,.02)); }
.win::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,.12); }
.win::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; background: rgba(255,255,255,.12); }
.sofa { position: absolute; left: 10%; bottom: 13%; width: 50%; height: 15%; border-radius: 7px 7px 3px 3px; background: rgba(255,255,255,.10); }
.sofa::before { content: ""; position: absolute; left: 6%; right: 6%; top: -42%; height: 46%; border-radius: 6px 6px 0 0; background: rgba(255,255,255,.07); }
.table { position: absolute; right: 22%; bottom: 11%; width: 22%; height: 5%; border-radius: 2px; background: rgba(255,255,255,.16); }
.igrid { flex: 1; min-height: 0; display: grid; gap: 10px; }
.igrid-1 { grid-template: minmax(0,1fr) / minmax(0,1fr); }
.igrid-2 { grid-template: minmax(0,1fr) / repeat(2, minmax(0,1fr)); }
.igrid-3 { grid-template: minmax(0,1fr) / repeat(3, minmax(0,1fr)); }
.igrid-4 { grid-template: repeat(2, minmax(0,1fr)) / repeat(2, minmax(0,1fr)); }
.ishot { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid #282828; border-radius: 8px; background: #181818; }
.ishot.is-primary { border-color: #737373; }
.ishot > .ph { width: 100%; height: 100%; }
.ilabel { position: absolute; top: 10px; left: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #f3f3f5; }
.ilabel > span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; background: #181818; }
.isize { position: absolute; right: 10px; bottom: 8px; z-index: 2; padding: 1px 5px; border-radius: 3px; background: #181818; color: #b4b4bc; font-size: 10px; font-variant-numeric: tabular-nums; }
.itools { position: absolute; z-index: 3; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #4a4a4a; border-radius: 7px; background: #1f1f20; box-shadow: 0 4px 12px rgb(0 0 0 / 35%); }
.itools .tb { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; color: #f3f3f5; }
.ishot-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; height: 100%; color: #b4b4bc; font-size: 12px; text-align: center; }
.ishot-empty p { margin: 0; font-size: 11px; color: #7e7e88; }
.canvas.grid-mode { padding: 12px; gap: 0; align-items: stretch; justify-content: stretch; }
.canvas.grid-mode .igrid { width: 100%; }
.selbar { flex: 0 0 34px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #141414; border-bottom: 1px solid var(--hair-2); font-size: 10.5px; color: #9a9aa3; }
.selbar button { margin-left: auto; color: #b9b9c2; }
.empty-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.empty-stage h3 { margin: 0; font-size: 15px; font-weight: 600; }
.empty-stage p { margin: 0; max-width: 380px; width: 100%; font-size: 12px; line-height: 1.85; color: #7f7f88; }
</style></head><body>

<div class="app">
<aside class="panel" style="width:258px;flex:none">

    <div class="actions"><button class="icon-btn"><svg class="i i-13"><use href="#i-search"/></svg></button><button class="icon-btn"><svg class="i i-13"><use href="#i-plus"/></svg></button></div>

<section class="stage" aria-label="素材预览">
  <header class="stage-head"><h1>素材</h1><span class="tag">未创建</span></header>
  <div class="canvas">
    <div class="empty-stage">
      <div style="width:56px;height:56px;display:grid;place-items:center;border:1px solid #333;border-radius:14px;background:#1b1b1d;color:#8a8a93"><svg class="i i-20"><use href="#i-card"/></svg></div>

      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="btn primary" style="height:32px"><svg class="i i-13"><use href="#i-spark"/></svg>从剧本提取（10 个）</button>

      </div>
      <div style="margin-top:10px;display:flex;gap:6px;align-items:center;font-size:10.5px;color:#5d5d66">
        <svg class="i i-12"><use href="#i-check"/></svg>提取只建卡，不自动生成图片，可以逐个确认后再跑
      </div>
    </div>
  </div>

</section>

  </div>
